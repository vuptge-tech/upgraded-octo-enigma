<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU Online - Radar Săn Thỏ Hàng Loạt</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: rgba(18, 24, 38, 0.94);
            --gold-border: #c5a059;
            --gold-glow: rgba(197, 160, 89, 0.4);
            --rabbit-1: #00d2ff;
            --rabbit-2: #ff4081;
            --text-light: #e6ebf5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); overflow: hidden; height: 100vh; display: flex; }

        /* Sidebar */
        #sidebar {
            width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-right: 2px solid var(--gold-border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            overflow-y: auto;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: var(--gold-border);
            text-align: center;
            text-shadow: 0 0 10px var(--gold-glow);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 5px;
        }

        .panel-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 6px;
            padding: 9px;
        }

        .panel-box h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.76rem;
            color: var(--gold-border);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Ô Dán Hàng Loạt (Batch Input) */
        .batch-area {
            width: 100%;
            height: 60px;
            background: #06080c;
            border: 1px dashed var(--gold-border);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-family: monospace;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        .batch-area:focus {
            border-color: var(--rabbit-1);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        .batch-status {
            font-size: 0.68rem;
            color: #00e676;
            margin-top: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Map Selector */
        select.map-select {
            width: 100%;
            background: #06080c;
            border: 1px solid var(--gold-border);
            color: #ffd700;
            padding: 7px 10px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
        }
        select.map-select option { background: #0f141f; color: #fff; }

        /* Realtime Coordinate */
        .live-coord {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--gold-border);
            text-align: center;
            font-family: monospace;
            background: #05070a;
            padding: 5px;
            border-radius: 4px;
            border: 1px dashed rgba(197, 160, 89, 0.4);
        }

        /* Rabbit Cards */
        .rabbit-input-card {
            border-left: 3px solid;
            padding: 5px 8px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0 4px 4px 0;
        }
        .rabbit-input-card.card-1 { border-color: var(--rabbit-1); }
        .rabbit-input-card.card-2 { border-color: var(--rabbit-2); }

        .card-header {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        .card-1 .card-header { color: var(--rabbit-1); }
        .card-2 .card-header { color: var(--rabbit-2); }

        .coord-inputs { display: flex; gap: 6px; }
        .input-group { flex: 1; }
        .input-group label { display: block; font-size: 0.62rem; color: #8fa0b5; margin-bottom: 1px; }

        input[type="number"] {
            width: 100%;
            background: #06080c;
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            outline: none;
            text-align: center;
            font-size: 0.9rem;
        }

        input[type="number"]:focus {
            border-color: var(--gold-border);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        /* Nút Bấm */
        .btn-action {
            width: 100%;
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1c 100%);
            border: 1px solid #ffe89e;
            color: #000;
            padding: 7px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }
        .btn-action:hover { filter: brightness(1.2); box-shadow: 0 0 10px var(--gold-glow); }

        .btn-batch-save {
            background: linear-gradient(180deg, #ff4081 0%, #c2185b 100%);
            border: 1px solid #ff80ab;
            color: #fff;
        }
        .btn-batch-save:hover { box-shadow: 0 0 10px rgba(255, 64, 129, 0.5); }

        /* Khoảng cách */
        .dist-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #b0bec5;
            padding: 3px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 3px;
        }
        .dist-value { font-family: monospace; font-weight: bold; color: #ffd700; }

        /* Quản lý bộ nhớ */
        .storage-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #8fa0b5;
        }

        .btn-tiny {
            background: transparent;
            border: 1px solid rgba(197,160,89,0.3);
            color: #ccc;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65rem;
        }
        .btn-tiny:hover { color: #fff; border-color: var(--gold-border); }
        .btn-tiny.danger:hover { color: #ff3860; border-color: #ff3860; }

        /* Map Container */
        #map-container { flex: 1; height: 100vh; background: #05070a; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Marker 2 Thỏ hiện tại */
        .active-rabbit-pin {
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff;
            color: #fff; font-weight: bold; font-size: 11px;
            animation: pulseActive 1.3s infinite;
        }
        .pin-r1 { background: var(--rabbit-1); box-shadow: 0 0 15px var(--rabbit-1); }
        .pin-r2 { background: var(--rabbit-2); box-shadow: 0 0 15px var(--rabbit-2); }

        @keyframes pulseActive {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.18); }
            100% { transform: scale(0.95); }
        }

        /* Dấu chấm lịch sử */
        .dot-marker { border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .dot-marker:hover { transform: scale(1.8); }
        .dot-lvl-1 { width: 8px; height: 8px; background: #ffd700; border: 1px solid #fff; box-shadow: 0 0 4px #ffd700; }
        .dot-lvl-2 { width: 10px; height: 10px; background: #ff9100; border: 1.5px solid #fff; box-shadow: 0 0 8px #ff9100; }
        .dot-lvl-3 { width: 13px; height: 13px; background: #ff0055; border: 2px solid #fff; box-shadow: 0 0 14px #ff0055; }

        .origin-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid var(--gold-border);
            padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; color: var(--gold-border);
            z-index: 500; pointer-events: none; font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1 class="game-title" id="currentMapTitle">NORIA</h1>

        <!-- ⚡ KHỐI DÁN HÀNG LOẠT (SMART BATCH PASTE) -->
        <div class="panel-box">
            <h3><span>📋 Dán Nhanh Toàn Bộ Map</span></h3>
            <textarea id="batchInput" class="batch-area" placeholder="Dán đoạn chat/thông báo vào đây...
VD: Noria (185,32) Lorencia (156,80)..." oninput="processBatchInput()"></textarea>
            <div class="batch-status">
                <span id="batchCountText">Chưa có dữ liệu dán</span>
                <button class="btn-tiny" onclick="clearBatch()" style="color:#aaa;">Xóa ô dán</button>
            </div>
            <button class="btn-action btn-batch-save" onclick="saveAllBatchToHistory()">
                💾 Lưu Toàn Bộ Đợt Này Vào Ổ Thỏ
            </button>
        </div>

        <!-- Chọn Map -->
        <div class="panel-box">
            <h3>Chọn Bản Đồ</h3>
            <select class="map-select" id="mapSelect" onchange="onMapChange(this.value)"></select>
        </div>

        <!-- Tọa độ con trỏ -->
        <div class="panel-box">
            <h3>Tọa độ con trỏ [X, Y]</h3>
            <div class="live-coord" id="cursorCoord">X: 0 | Y: 0</div>
        </div>

        <!-- Form 2 Tọa Độ Thỏ (Tự điền khi đổi Map) -->
        <div class="panel-box">
            <h3>Vị Trí Thỏ Map Hiện Tại</h3>

            <div class="rabbit-input-card card-1">
                <div class="card-header">
                    <span>🐇 THỎ 1 (ĐIỂM A)</span>
                    <span id="labelR1">[Chưa chọn]</span>
                </div>
                <div class="coord-inputs">
                    <div class="input-group">
                        <label>X (Dọc: 0-255)</label>
                        <input type="number" id="x1" min="0" max="255">
                    </div>
                    <div class="input-group">
                        <label>Y (Ngang: 0-255)</label>
                        <input type="number" id="y1" min="0" max="255">
                    </div>
                </div>
            </div>

            <div class="rabbit-input-card card-2">
                <div class="card-header">
                    <span>🐰 THỎ 2 (ĐIỂM B)</span>
                    <span id="labelR2">[Chưa chọn]</span>
                </div>
                <div class="coord-inputs">
                    <div class="input-group">
                        <label>X (Dọc: 0-255)</label>
                        <input type="number" id="x2" min="0" max="255">
                    </div>
                    <div class="input-group">
                        <label>Y (Ngang: 0-255)</label>
                        <input type="number" id="y2" min="0" max="255">
                    </div>
                </div>
            </div>

            <div class="dist-info">
                <span>Khoảng cách 2 Thỏ:</span>
                <span class="dist-value" id="distText">-- tiles</span>
            </div>

            <button class="btn-action" onclick="recordBothSpawns()">💾 Lưu Dấu Chấm Map Này (+1)</button>
        </div>

        <!-- Quản lý bộ nhớ -->
        <div class="panel-box">
            <div class="storage-bar">
                <span id="savedCountText">Đã lưu: 0 ổ thỏ</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn-tiny" onclick="toggleDots()" id="btnToggleDots">👁️ Ẩn Chấm</button>
                    <button class="btn-tiny danger" onclick="clearMapHistory()">🗑️ Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Viewport -->
    <div id="map-container">
        <div class="origin-badge" id="mapBadge">🗺️ Noria | ↖ [X:0, Y:0]</div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // =======================================================
        // DANH SÁCH BẢN ĐỒ DÙNG ĐƯỜNG DẪN ẢNH NỘI BỘ (LOCAL)
        // =======================================================
        const MAP_DATA = {
            noria:    { name: "Noria", img: "./images/noria.jpg" },
            lorencia: { name: "Lorencia", img: "./images/lorencia.jpg" },
            devias:   { name: "Devias", img: "./images/devias.jpg" },
            elveland: { name: "Elveland", img: "./images/elveland.jpg" },
            kanturu:  { name: "Kanturu Ruins", img: "./images/kanturu.jpg" },
            karutan1: { name: "Karutan 1", img: "./images/karutan1.jpg" },
            karutan2: { name: "Karutan 2", img: "./images/karutan2.jpg" },
            ferea:    { name: "Ferea", img: "./images/ferea.jpg" }
        };

        // Bảng ánh xạ tên map viết trong văn bản -> Key hệ thống
        const MAP_KEY_ALIAS = {
            'noria': 'noria',
            'lorencia': 'lorencia',
            'devias': 'devias',
            'elveland': 'elveland',
            'elbeland': 'elveland',
            'kanturu ruins': 'kanturu',
            'kanturu': 'kanturu',
            'karutan 1': 'karutan1',
            'karutan1': 'karutan1',
            'karutan 2': 'karutan2',
            'karutan2': 'karutan2',
            'ferea': 'ferea'
        };

        const MAP_SIZE = 256;
        const bounds = [[0, 0], [MAP_SIZE, MAP_SIZE]];
        let currentMapKey = 'noria';
        let showDots = true;

        // Lưu trữ đợt thỏ vừa dán hàng loạt
        let batchRabbits = {};

        // Lịch sử dấu chấm lưu vĩnh viễn trong LocalStorage
        let rabbitSpawns = JSON.parse(localStorage.getItem('MU_RABBIT_SPAWNS')) || {};
        function saveSpawns() { localStorage.setItem('MU_RABBIT_SPAWNS', JSON.stringify(rabbitSpawns)); }

        // Preload hình ảnh nội bộ vào RAM
        Object.keys(MAP_DATA).forEach(k => { const img = new Image(); img.src = MAP_DATA[k].img; });

        // Dropdown Map
        const mapSelectElem = document.getElementById('mapSelect');
        Object.keys(MAP_DATA).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key; opt.textContent = MAP_DATA[key].name;
            if (key === currentMapKey) opt.selected = true;
            mapSelectElem.appendChild(opt);
        });

        // Khởi tạo Map
        const map = L.map('map', {
            crs: L.CRS.Simple, minZoom: -1, maxZoom: 3,
            maxBounds: bounds, maxBoundsViscosity: 1.0, attributionControl: false
        });

        let currentImageOverlay = L.imageOverlay(MAP_DATA[currentMapKey].img, bounds).addTo(map);
        map.fitBounds(bounds);

        // Chuyển đổi tọa độ Matrix chuẩn 1:1 [X, Y]: X Dọc (0-255), Y Ngang (0-255)
        function leafletToGame(latlng) {
            return {
                x: Math.max(0, Math.min(255, Math.floor(MAP_SIZE - latlng.lat))),
                y: Math.max(0, Math.min(255, Math.floor(latlng.lng)))
            };
        }
        function gameToLeaflet(x, y) {
            return [(MAP_SIZE - 1) - x + 0.5, y + 0.5];
        }

        map.on('mousemove', function(e) {
            const { x, y } = leafletToGame(e.latlng);
            document.getElementById('cursorCoord').innerText = `X: ${x} | Y: ${y}`;
        });

        // =======================================================
        // ⚡ BỘ BÓC TÁCH DÁN HÀNG LOẠT (SMART REGEX PARSER)
        // =======================================================
        function processBatchInput() {
            const rawText = document.getElementById('batchInput').value;
            batchRabbits = {};

            if (!rawText.trim()) {
                document.getElementById('batchCountText').innerText = "Chưa có dữ liệu dán";
                return;
            }

            // Regex nhận diện tên map và cặp số (X,Y) hoặc (X.Y)
            const regex = /(Kanturu Ruins|Kanturu|Karutan\s*1|Karutan\s*2|Karutan|Ferea|Lorencia|Elbeland|Elveland|Devias|Noria)[^\d\(]*\(?\s*(\d+)[\.,\s]+(\d+)\s*\)?/gi;
            let match;
            let totalCount = 0;

            while ((match = regex.exec(rawText)) !== null) {
                const mapRaw = match[1].toLowerCase().replace(/\s+/g, ' ').trim();
                const mapKey = MAP_KEY_ALIAS[mapRaw];
                const x = parseInt(match[2], 10);
                const y = parseInt(match[3], 10);

                if (mapKey && !isNaN(x) && !isNaN(y)) {
                    if (!batchRabbits[mapKey]) batchRabbits[mapKey] = [];
                    batchRabbits[mapKey].push({ x, y });
                    totalCount++;
                }
            }

            const mapCount = Object.keys(batchRabbits).length;
            if (totalCount > 0) {
                document.getElementById('batchCountText').innerText = `⚡ Đã nạp ${mapCount} map (${totalCount} thỏ)`;
                loadBatchCoordsToCurrentMap();
            } else {
                document.getElementById('batchCountText').innerText = "❌ Không tìm thấy tọa độ hợp lệ";
            }
        }

        function clearBatch() {
            document.getElementById('batchInput').value = '';
            batchRabbits = {};
            document.getElementById('batchCountText').innerText = "Chưa có dữ liệu dán";
            document.getElementById('x1').value = '';
            document.getElementById('y1').value = '';
            document.getElementById('x2').value = '';
            document.getElementById('y2').value = '';
            updateActiveRabbits();
        }

        // Tự động gán 2 tọa độ vào ô khi mở map
        function loadBatchCoordsToCurrentMap() {
            const coords = batchRabbits[currentMapKey];
            if (coords && coords.length > 0) {
                document.getElementById('x1').value = coords[0].x;
                document.getElementById('y1').value = coords[0].y;

                if (coords.length > 1) {
                    document.getElementById('x2').value = coords[1].x;
                    document.getElementById('y2').value = coords[1].y;
                } else {
                    document.getElementById('x2').value = '';
                    document.getElementById('y2').value = '';
                }
            }
            updateActiveRabbits();
        }

        // Lưu toàn bộ vị trí trên tất cả các map vào lịch sử dấu chấm
        function saveAllBatchToHistory() {
            const mapKeys = Object.keys(batchRabbits);
            if (mapKeys.length === 0) {
                alert("Chưa có danh sách dán hàng loạt để lưu!");
                return;
            }

            let savedTotal = 0;
            mapKeys.forEach(k => {
                if (!rabbitSpawns[k]) rabbitSpawns[k] = [];
                batchRabbits[k].forEach(pt => {
                    const existing = rabbitSpawns[k].find(p => p.x === pt.x && p.y === pt.y);
                    if (existing) existing.count++;
                    else rabbitSpawns[k].push({ x: pt.x, y: pt.y, count: 1 });
                    savedTotal++;
                });
            });

            saveSpawns();
            renderHistoryDots();
            alert(`Đã lưu thành công ${savedTotal} vị trí thỏ trên ${mapKeys.length} map vào ổ thỏ!`);
        }

        // =======================================================
        // QUẢN LÝ VẼ 2 THỎ & DẤU CHẤM
        // =======================================================
        let markerR1 = null, markerR2 = null;
        let connectionLine = null;
        let historyDotMarkers = [];
        let clickToggle = 0;

        const iconR1 = L.divIcon({ className: 'custom-pin-r1', html: '<div class="active-rabbit-pin pin-r1">T1</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
        const iconR2 = L.divIcon({ className: 'custom-pin-r2', html: '<div class="active-rabbit-pin pin-r2">T2</div>', iconSize: [26, 26], iconAnchor: [13, 13] });

        function parseCoord(val) {
            if (val === '' || isNaN(val)) return null;
            return Math.max(0, Math.min(255, parseInt(val, 10)));
        }

        function updateActiveRabbits() {
            const x1 = parseCoord(document.getElementById('x1').value);
            const y1 = parseCoord(document.getElementById('y1').value);
            const x2 = parseCoord(document.getElementById('x2').value);
            const y2 = parseCoord(document.getElementById('y2').value);

            const hasR1 = (x1 !== null && y1 !== null);
            const hasR2 = (x2 !== null && y2 !== null);
            let pos1 = null, pos2 = null;

            if (hasR1) {
                pos1 = gameToLeaflet(x1, y1);
                if (markerR1) markerR1.setLatLng(pos1);
                else markerR1 = L.marker(pos1, { icon: iconR1, zIndexOffset: 1000 }).addTo(map);
                markerR1.bindPopup(`<b>🐇 THỎ 1</b>: [${x1}, ${y1}]`);
                document.getElementById('labelR1').innerText = `[${x1}, ${y1}]`;
            } else {
                if (markerR1) { map.removeLayer(markerR1); markerR1 = null; }
                document.getElementById('labelR1').innerText = `[Chưa chọn]`;
            }

            if (hasR2) {
                pos2 = gameToLeaflet(x2, y2);
                if (markerR2) markerR2.setLatLng(pos2);
                else markerR2 = L.marker(pos2, { icon: iconR2, zIndexOffset: 1000 }).addTo(map);
                markerR2.bindPopup(`<b>🐰 THỎ 2</b>: [${x2}, ${y2}]`);
                document.getElementById('labelR2').innerText = `[${x2}, ${y2}]`;
            } else {
                if (markerR2) { map.removeLayer(markerR2); markerR2 = null; }
                document.getElementById('labelR2').innerText = `[Chưa chọn]`;
            }

            if (hasR1 && hasR2) {
                if (connectionLine) connectionLine.setLatLngs([pos1, pos2]);
                else connectionLine = L.polyline([pos1, pos2], { color: '#ffd700', weight: 2.5, dashArray: '6, 8', opacity: 0.9 }).addTo(map);

                const dx = Math.abs(x2 - x1);
                const dy = Math.abs(y2 - y1);
                document.getElementById('distText').innerText = `${Math.sqrt(dx*dx + dy*dy).toFixed(1)} ô (~${dx+dy} bước)`;
            } else {
                if (connectionLine) { map.removeLayer(connectionLine); connectionLine = null; }
                document.getElementById('distText').innerText = `-- tiles`;
            }
        }

        function renderHistoryDots() {
            historyDotMarkers.forEach(m => map.removeLayer(m));
            historyDotMarkers = [];

            const spawns = rabbitSpawns[currentMapKey] || [];
            document.getElementById('savedCountText').innerText = `Đã lưu: ${spawns.length} ổ thỏ`;

            if (!showDots) return;

            spawns.forEach(item => {
                const pos = gameToLeaflet(item.x, item.y);
                let lvlClass = item.count >= 4 ? 'dot-lvl-3' : (item.count >= 2 ? 'dot-lvl-2' : 'dot-lvl-1');
                let dotSize = item.count >= 4 ? 13 : (item.count >= 2 ? 10 : 8);

                const dotIcon = L.divIcon({
                    className: 'custom-dot-wrapper',
                    html: `<div class="dot-marker ${lvlClass}"></div>`,
                    iconSize: [dotSize, dotSize],
                    iconAnchor: [dotSize / 2, dotSize / 2]
                });

                const marker = L.marker(pos, { icon: dotIcon }).addTo(map);
                marker.bindTooltip(`[${item.x}, ${item.y}] • Đã ra: ${item.count} lần`, { direction: 'top', offset: [0, -6] });
                marker.on('click', (e) => { L.DomEvent.stopPropagation(e); fillCoord(item.x, item.y); });
                historyDotMarkers.push(marker);
            });
        }

        function recordBothSpawns() {
            const x1 = parseCoord(document.getElementById('x1').value);
            const y1 = parseCoord(document.getElementById('y1').value);
            const x2 = parseCoord(document.getElementById('x2').value);
            const y2 = parseCoord(document.getElementById('y2').value);

            if (!rabbitSpawns[currentMapKey]) rabbitSpawns[currentMapKey] = [];
            let recorded = 0;

            if (x1 !== null && y1 !== null) {
                const ex = rabbitSpawns[currentMapKey].find(p => p.x === x1 && p.y === y1);
                if (ex) ex.count++; else rabbitSpawns[currentMapKey].push({ x: x1, y: y1, count: 1 });
                recorded++;
            }
            if (x2 !== null && y2 !== null) {
                const ex = rabbitSpawns[currentMapKey].find(p => p.x === x2 && p.y === y2);
                if (ex) ex.count++; else rabbitSpawns[currentMapKey].push({ x: x2, y: y2, count: 1 });
                recorded++;
            }

            if (recorded === 0) return alert("Vui lòng nhập ít nhất 1 tọa độ!");
            saveSpawns();
            renderHistoryDots();
            updateActiveRabbits();
        }

        function fillCoord(x, y) {
            if (clickToggle === 0) {
                document.getElementById('x1').value = x;
                document.getElementById('y1').value = y;
                clickToggle = 1;
            } else {
                document.getElementById('x2').value = x;
                document.getElementById('y2').value = y;
                clickToggle = 0;
            }
            updateActiveRabbits();
        }

        function toggleDots() {
            showDots = !showDots;
            document.getElementById('btnToggleDots').innerText = showDots ? "👁️ Ẩn Chấm" : "👁️ Hiện Chấm";
            renderHistoryDots();
        }

        function clearMapHistory() {
            if (!confirm(`Xóa toàn bộ dấu chấm map ${MAP_DATA[currentMapKey].name}?`)) return;
            rabbitSpawns[currentMapKey] = [];
            saveSpawns();
            renderHistoryDots();
        }

        ['x1', 'y1', 'x2', 'y2'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => updateActiveRabbits());
        });

        map.on('click', function(e) {
            const { x, y } = leafletToGame(e.latlng);
            fillCoord(x, y);
        });

        // Khi người dùng đổi Map từ Dropdown
        function onMapChange(key) {
            if (!MAP_DATA[key]) return;
            currentMapKey = key;
            currentImageOverlay.setUrl(MAP_DATA[key].img);
            document.getElementById('currentMapTitle').innerText = MAP_DATA[key].name.toUpperCase();
            document.getElementById('mapBadge').innerText = `🗺️ ${MAP_DATA[key].name} | ↖ [X:0, Y:0]`;

            // Tự động load tọa độ của map mới từ danh sách dán hàng loạt
            loadBatchCoordsToCurrentMap();
            renderHistoryDots();
        }

        renderHistoryDots();
        updateActiveRabbits();
    </script>
</body>
</html>
